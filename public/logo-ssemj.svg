<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gold gradient for the central artistic calligraphy -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffde59" />
      <stop offset="50%" stop-color="#fdb813" />
      <stop offset="100%" stop-color="#d98200" />
    </linearGradient>

    <!-- Navy blue gradient for the circular crest -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2f78" />
      <stop offset="100%" stop-color="#0f1a4a" />
    </linearGradient>

    <!-- Crimson Red -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62129" />
      <stop offset="100%" stop-color="#b8141b" />
    </linearGradient>

    <!-- Path for circular text: SEKOLAH SENI MALAYSIA JOHOR -->
    <!-- Center of circle is at (355, 155), radius ~ 72 -->
    <path id="circleTextPath" d="M 283,155 A 72,72 0 1,1 427,155 A 72,72 0 1,1 283,155" />
    
    <!-- Path for curved motto text along the emblem wing -->
    <path id="mottoArcPath" d="M 220,105 Q 260,195 305,275" />
  </defs>

  <!-- Clean Background -->
  <rect width="600" height="600" fill="#ffffff" rx="24" />

  <!-- ================= EMBLEM SECTION ================= -->
  <g transform="translate(15, -10)">
    <!-- 1. Horizontal Red Staff Lines on Left Wing -->
    <g stroke="#d62229" stroke-width="4" stroke-linecap="round">
      <line x1="165" y1="80" x2="310" y2="80" />
      <line x1="188" y1="102" x2="330" y2="102" />
      <line x1="205" y1="124" x2="345" y2="124" />
      <line x1="218" y1="146" x2="350" y2="146" />
      <line x1="225" y1="168" x2="350" y2="168" />
      <line x1="222" y1="190" x2="340" y2="190" />
      <line x1="208" y1="212" x2="330" y2="212" />
      <line x1="185" y1="234" x2="320" y2="234" />
      <line x1="155" y1="256" x2="310" y2="256" />
    </g>

    <!-- Outer Wing Contour (Red Curves outlining the staff) -->
    <path d="M 310,75 C 230,75 160,80 150,90 C 145,95 190,135 225,165 C 220,185 160,230 140,255 C 135,262 170,275 305,275" 
          fill="none" stroke="#d62229" stroke-width="5" stroke-linecap="round" />

    <!-- Text arched along the wing curve: PENJANA PEWARIS BUDAYA BANGSA -->
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11" fill="#111827" letter-spacing="1">
      <textPath href="#mottoArcPath" startOffset="8%">
        PENJANA PEWARIS BUDAYA BANGSA
      </textPath>
    </text>

    <!-- 2. Navy Blue Circular Crest (World / Globe) -->
    <circle cx="370" cy="165" r="76" fill="url(#navyGrad)" stroke="#d62229" stroke-width="4.5" />
    <circle cx="370" cy="165" r="54" fill="#0d173d" />

    <!-- Arched Text Inside Blue Circle: SEKOLAH SENI MALAYSIA JOHOR -->
    <!-- Lower arc for readable curved text -->
    <path id="blueArcBottom" d="M 432,165 A 62,62 0 0,1 308,165" fill="none" />
    <path id="blueArcTop" d="M 308,165 A 62,62 0 0,1 432,165" fill="none" />

    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11.5" fill="#ffffff" letter-spacing="1.8">
      <textPath href="#blueArcBottom" startOffset="50%" text-anchor="middle">
        SEKOLAH SENI
      </textPath>
    </text>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11.5" fill="#ffffff" letter-spacing="1.8">
      <textPath href="#blueArcTop" startOffset="50%" text-anchor="middle">
        MALAYSIA JOHOR
      </textPath>
    </text>

    <!-- 3. Central Stylized Motif: Golden Calligraphy "SENI" / Treble / Flame / Gambus -->
    <!-- Main golden upward stroke -->
    <path d="M 365,65 C 390,95 385,130 365,160 C 345,190 325,215 320,240 C 315,260 330,270 345,265 C 360,260 375,235 380,210 C 385,185 375,165 365,145 C 360,135 360,120 368,105 C 374,92 380,82 365,65 Z"
          fill="url(#goldGrad)" stroke="#c27d00" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))" />

    <!-- Inner Golden Swirl -->
    <path d="M 345,150 C 335,170 335,195 350,215 C 365,230 380,215 375,195 C 370,175 355,165 345,150 Z"
          fill="url(#goldGrad)" opacity="0.95" />

    <!-- Dynamic Red Crescent / Flame accent in the center -->
    <path d="M 360,115 C 372,130 372,150 360,170 C 350,185 342,205 345,225 C 335,210 335,190 344,170 C 352,152 355,135 360,115 Z"
          fill="url(#redGrad)" />

    <!-- Red Dot (Nukhtah / Accent at top) -->
    <circle cx="386" cy="118" r="6.5" fill="url(#redGrad)" stroke="#ffffff" stroke-width="1" />

    <!-- Bottom Red Emblem Star / Base Accent -->
    <path d="M 322,258 L 332,258 L 335,268 L 328,276 L 318,272 Z" fill="url(#redGrad)" />
  </g>

  <!-- ================= TYPOGRAPHY SECTION ================= -->
  <!-- "SEKOLAH SENI" -->
  <text x="300" y="362" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', Arial, sans-serif" 
        font-weight="900" 
        font-size="44" 
        fill="#14235e" 
        letter-spacing="4">
    SEKOLAH SENI
  </text>

  <!-- "MALAYSIA JOHOR" -->
  <text x="300" y="422" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', Arial, sans-serif" 
        font-weight="900" 
        font-size="54" 
        fill="#14235e" 
        letter-spacing="3.5">
    MALAYSIA JOHOR
  </text>

  <!-- Red Horizontal Divider Line -->
  <line x1="45" y1="446" x2="555" y2="446" stroke="#cc1e24" stroke-width="4" stroke-linecap="round" />

  <!-- "PENJANA PEWARIS BUDAYA BANGSA" -->
  <text x="300" y="480" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', Arial, sans-serif" 
        font-weight="800" 
        font-size="20" 
        fill="#14235e" 
        letter-spacing="4.2">
    PENJANA PEWARIS BUDAYA BANGSA
  </text>

  <!-- "Sekolah Kluster Kecemerlangan" in Red Script Font -->
  <text x="300" y="525" 
        text-anchor="middle" 
        font-family="'Playfair Display', Georgia, 'Brush Script MT', cursive" 
        font-style="italic" 
        font-weight="700" 
        font-size="34" 
        fill="#cc1e24" 
        letter-spacing="0.5">
    Sekolah Kluster Kecemerlangan
  </text>
</svg>
